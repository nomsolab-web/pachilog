name: Reclassify videos apply once

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply-once:
    environment: pachilog_secret
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_AUTH_TOKEN: ${{ secrets.DATABASE_AUTH_TOKEN }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      RECLASSIFY_VIDEOS_ALLOW_WRITE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Validate required secrets
        shell: bash
        run: |
          for name in DATABASE_URL DATABASE_AUTH_TOKEN YOUTUBE_API_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required GitHub Actions secret: ${name}" >&2
              exit 1
            fi
          done

      - name: Create pre-apply database dump
        shell: bash
        run: |
          set -euo pipefail
          http_url="${DATABASE_URL/libsql:/https:}"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${DATABASE_AUTH_TOKEN}" \
            "${http_url}/dump" \
            --output "$RUNNER_TEMP/pachilog-pre-apply.dump"
          test -s "$RUNNER_TEMP/pachilog-pre-apply.dump"

      - name: Upload pre-apply database dump
        uses: actions/upload-artifact@v4
        with:
          name: pachilog-pre-apply-database-dump-${{ github.run_id }}
          path: ${{ runner.temp }}/pachilog-pre-apply.dump
          retention-days: 30

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply video reclassification once
        shell: bash
        run: |
          set -o pipefail
          cd packages/web
          bun run data:reclassify-videos -- --refresh-metadata --apply | tee "$RUNNER_TEMP/reclassify-apply.log" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Verify with refresh-metadata dry-run
        shell: bash
        run: |
          set -o pipefail
          cd packages/web
          bun run data:reclassify-videos -- --refresh-metadata | tee "$RUNNER_TEMP/reclassify-verify.log" | tee -a "$GITHUB_STEP_SUMMARY"
          grep -q '"total": 0' "$RUNNER_TEMP/reclassify-verify.log"

      - name: Upload apply and verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pachilog-reclassify-apply-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/reclassify-apply.log
            ${{ runner.temp }}/reclassify-verify.log
          if-no-files-found: ignore
