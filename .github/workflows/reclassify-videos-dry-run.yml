name: Reclassify videos dry-run

on:
  workflow_dispatch:
    inputs:
      refresh_metadata:
        description: Refresh video metadata before reclassification
        type: boolean
        default: true
      apply:
        description: Apply reclassification changes to production
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  reclassify:
    environment: pachilog_secret
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_AUTH_TOKEN: ${{ secrets.DATABASE_AUTH_TOKEN }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Validate required secrets
        shell: bash
        run: |
          for name in DATABASE_URL DATABASE_AUTH_TOKEN YOUTUBE_API_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required GitHub Actions secret: ${name}" >&2
              exit 1
            fi
          done

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run video reclassification dry-run
        shell: bash
        run: |
          cd packages/web
          args=()
          if [ "${{ inputs.refresh_metadata }}" = "true" ]; then
            args+=(--refresh-metadata)
          fi
          if [ "${{ inputs.apply }}" = "true" ]; then
            echo "::warning::Production apply mode enabled. This run will apply changes to production."
            echo "Production apply mode enabled. This run will apply changes to production." >> "$GITHUB_STEP_SUMMARY"
            args+=(--apply)
          fi
          bun run data:reclassify-videos -- "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload dry-run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reclassify-videos-dry-run-report
          path: ${{ github.step_summary }}
          if-no-files-found: ignore
