name: Merge duplicate machines dry-run

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dry-run:
    environment: pachilog_secret
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_AUTH_TOKEN: ${{ secrets.DATABASE_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Validate required secrets
        shell: bash
        run: |
          for name in DATABASE_URL DATABASE_AUTH_TOKEN; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required GitHub Actions secret: ${name}" >&2
              exit 1
            fi
          done

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run duplicate machine merge dry-run
        shell: bash
        run: |
          bun run --cwd packages/web data:merge-duplicate-machines -- --json | tee duplicate-machine-merge-dry-run.json
          {
            echo "## Duplicate Machine Merge Dry-run"
            echo
            echo '```json'
            cat duplicate-machine-merge-dry-run.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload dry-run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duplicate-machine-merge-dry-run
          path: duplicate-machine-merge-dry-run.json
          if-no-files-found: error
