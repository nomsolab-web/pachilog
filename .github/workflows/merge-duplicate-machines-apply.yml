name: Merge duplicate machines apply

on:
  workflow_dispatch:
    inputs:
      apply:
        description: Apply the verified duplicate machine merge to production
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  merge:
    environment: pachilog_secret
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_AUTH_TOKEN: ${{ secrets.DATABASE_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Validate required secrets
        shell: bash
        run: |
          for name in DATABASE_URL DATABASE_AUTH_TOKEN; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required GitHub Actions secret: ${name}" >&2
              exit 1
            fi
          done

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run duplicate machine merge
        shell: bash
        run: |
          args=(--json)
          echo "Verified duplicate machine merge targets:"
          echo "- canonical 8 / duplicate 5"
          echo "- canonical 6 / duplicate 3"
          echo "- canonical 7 / duplicate 4"
          if [ "${{ inputs.apply }}" = "true" ]; then
            echo "::warning::Production apply mode enabled. This run will merge duplicate machine records in production."
            args+=(--apply)
          else
            echo "apply=false; running dry-run only."
          fi
          bun run --cwd packages/web data:merge-duplicate-machines -- "${args[@]}" | tee duplicate-machine-merge-report.json
          {
            echo "## Duplicate Machine Merge Report"
            echo
            echo '```json'
            cat duplicate-machine-merge-report.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload merge report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duplicate-machine-merge-report
          path: duplicate-machine-merge-report.json
          if-no-files-found: error
