name: Apply Dead Mount duplicate merge

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type MERGE_80_INTO_6 to apply the verified production merge
        required: true
        type: string

permissions:
  contents: read

jobs:
  apply:
    environment: pachilog_secret
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_AUTH_TOKEN: ${{ secrets.DATABASE_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Validate confirmation and secrets
        shell: bash
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail

          if [ "$CONFIRMATION" != "MERGE_80_INTO_6" ]; then
            echo "Confirmation string mismatch. Refusing to run production apply." >&2
            exit 1
          fi

          for name in DATABASE_URL DATABASE_AUTH_TOKEN; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required GitHub Actions secret: ${name}" >&2
              exit 1
            fi
          done

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply verified Dead Mount duplicate merge
        shell: bash
        run: |
          set -euo pipefail

          echo "::warning::Production apply mode enabled for fixed target canonical ID 6 / duplicate ID 80."
          bun run --cwd packages/web data:apply-dead-mount-duplicate-merge | tee dead-mount-duplicate-apply-report.json
          {
            echo "## Dead Mount Duplicate Merge Apply Report"
            echo
            echo '```json'
            cat dead-mount-duplicate-apply-report.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload apply report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dead-mount-duplicate-apply-report
          path: dead-mount-duplicate-apply-report.json
          if-no-files-found: error
