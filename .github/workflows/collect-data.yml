name: Collect PachiLog data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/collect-data.yml]
  schedule:
    # Every day at 10:15 JST. GitHub Actions cron is expressed in UTC.
    - cron: "15 1 * * *"

concurrency:
  group: pachilog-data-collection
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    environment: pachilog_secret
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_AUTH_TOKEN: ${{ secrets.DATABASE_AUTH_TOKEN }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      COLLECT_SECRET_TOKEN: ${{ secrets.COLLECT_SECRET_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PORT: "3000"
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Validate required secrets
        shell: bash
        run: |
          for name in DATABASE_URL DATABASE_AUTH_TOKEN YOUTUBE_API_KEY COLLECT_SECRET_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "Missing required GitHub Actions secret: ${name}" >&2
              exit 1
            fi
          done
      - run: bun install --frozen-lockfile
      - name: Check machine vote duplicates before migrations
        run: bun run --cwd packages/web data:diagnose-machine-vote-duplicates
      - name: Initialize database
        run: |
          bun run --cwd packages/web db:migrate
          bun packages/web/src/api/data/seed.ts
          bun packages/web/src/api/data/seed-machines-run.ts
      - name: Start API and collect today's data
        shell: bash
        run: |
          cd packages/web
          stdbuf -oL -eL bun src/server.ts > /tmp/pachilog-server.log 2>&1 &
          server_pid=$!
          cleanup() {
            exit_code=$?
            echo "Server process diagnostics (exit_code=${exit_code})"
            if kill -0 "$server_pid" 2>/dev/null; then
              echo "server_pid=${server_pid} state=running"
              ps -o pid,ppid,stat,etime,cmd -p "$server_pid" || true
            else
              echo "server_pid=${server_pid} state=stopped"
            fi
            echo "Server log:"
            cat /tmp/pachilog-server.log >&2 || true
            kill "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          trap 'echo "Received SIGTERM"; exit 143' TERM
          trap 'echo "Received SIGINT"; exit 130' INT

          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:3000/api/health > /dev/null; then
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              cat /tmp/pachilog-server.log >&2
              exit 1
            fi
            sleep 1
          done

          post_collect() {
            local url="$1"
            local body
            if ! body=$(curl --fail-with-body --silent --show-error \
              -X POST \
              -H "x-collect-secret: ${COLLECT_SECRET_TOKEN}" \
              "$url"); then
              echo "::group::pachilog server diagnostics"
              if kill -0 "$server_pid" 2>/dev/null; then
                echo "server_pid=${server_pid} state=running"
                ps -o pid,ppid,stat,etime,cmd -p "$server_pid" || true
              else
                echo "server_pid=${server_pid} state=stopped"
              fi
              cat /tmp/pachilog-server.log >&2 || true
              echo "::endgroup::"
              return 1
            fi
            printf '%s' "$body"
          }

          channel_result=$(post_collect http://127.0.0.1:3000/api/collect/run)
          echo "Channel collection: ${channel_result}"
          CHANNEL_RESULT="${channel_result}" bun -e '
            const result = JSON.parse(process.env.CHANNEL_RESULT ?? "{}");
            const requested = result.channelsRequested ?? 0;
            const fetched = result.channelsFetched ?? 0;
            if (requested < 1 || fetched / requested < 0.95) {
              console.error("Channel collection was incomplete.", result.errors ?? []);
              process.exit(1);
            }
          '

          machine_status=0
          machine_result=$(post_collect 'http://127.0.0.1:3000/api/collect-machines/run?skipTracking=true') || machine_status=$?
          echo "Machine collection: ${machine_result}"
          MACHINE_RESULT="${machine_result}" bun -e '
            const result = JSON.parse(process.env.MACHINE_RESULT ?? "{}");
            const requested = result.channelsRequested ?? 0;
            const failed = result.failedChannels ?? 0;
            if (requested < 1 || (requested - failed) / requested < 0.95) {
              console.error("Machine collection was incomplete.", result.errors ?? []);
              process.exit(2);
            }
          ' || machine_status=$?

          tracking_result=$(post_collect http://127.0.0.1:3000/api/collect-machines/track)
          echo "Video tracking: ${tracking_result}"
          TRACKING_RESULT="${tracking_result}" bun -e '
            const result = JSON.parse(process.env.TRACKING_RESULT ?? "{}");
            const target = result.trackingTargetCount ?? 0;
            const success = result.trackingSuccessCount ?? 0;
            const failed = result.trackingFailedCount ?? 0;
            if (success + failed !== target) {
              console.error("Video tracking accounting was incomplete.", result);
              process.exit(1);
            }
          '
          if [ "$machine_status" -ne 0 ]; then
            echo "Machine collection failed; preserving its status after independent video tracking."
          fi
          if [ "$machine_status" -ne 0 ]; then
            exit "$machine_status"
          fi
